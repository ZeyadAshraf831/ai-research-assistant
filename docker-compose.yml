# PostgreSQL + pgvector only. Run Ollama on the host (better CPU/RAM use on a 16 GB laptop).
services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: research, POSTGRES_PASSWORD: research, POSTGRES_DB: research}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
